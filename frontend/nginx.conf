server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# API под тем же доменом: /api/* уходит на backend по внутренней сети docker.
	# Так фронт и API живут на одном origin — без CORS и без прямого выхода на IP.
	location /api/ {
		proxy_pass http://backend:3000/;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# SPA: любой неизвестный путь отдаём index.html, роутинг разрулит react-router.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
